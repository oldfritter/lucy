"zh-CN":
  code:
    # 系统/通用
    "1000": 成功
    "1001": 参数有错误
    "1002": 属性校验不通过
    "1003": 资源不存在
    "1004": 未登录
    "1005": 系统内部错误
    "1006": 外部服务异常

    # 用户/认证 (11xx)
    "1100": 账号或密码错误
    "1101": 旧密码验证失败
    "1102": 令牌已过期
    "1103": 用户名已存在

    # API Key (12xx)
    "1200": 最多创建 5 个 API Key
    "1201": API Key 不存在
    "1202": API Key 验证失败
    "1203": API Key 已禁用

    # 验证码 (13xx)
    "1300": 验证码验证失败
    "1301": 验证码不存在
    "1302": 无可用验证码
    "1303": 请求频率超限

    # 订单/支付 (14xx)
    "1400": 订单不存在
    "1401": 订单状态不允许
    "1402": 支付下单失败
    "1403": 退款金额超限
    "1404": 入账记录不存在
    "1405": 订单号缺失

    # 业务/资源 (15xx)
    "1500": 投放不存在
    "1501": 投放状态不允许
    "1502": 商品不存在
    "1503": 图片不存在
    "1504": 不支持的图片格式
    "1505": OSS 操作失败
